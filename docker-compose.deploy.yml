# Git 模板（仅参考）。生产环境请维护服务器 /opt/yunhai/docker-compose.prod.yml，
# 内含 LLM / 分享等密钥与挂载；禁止 cp 覆盖！发布请用 scripts/deploy-prod.sh
services:
  redis:
    image: docker.1ms.run/library/redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  yunhai:
    image: yunhai:latest
    command: []  # 使用镜像 ENTRYPOINT（docker-entrypoint.sh → uvicorn）
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SCENIC_SPOTS_DIR=/app/data/scenic-spots
      - TERRAIN_SNAPSHOTS_DIR=/app/data/terrain
      - STATIC_DIR=/app/static
      - TZ=Asia/Shanghai
      - CORS_ORIGINS=["https://yunhai.timkj.com"]
      - ALLOWED_HOSTS=["yunhai.timkj.com","localhost","127.0.0.1"]
      - ANALYTICS_ENABLED=true
      - ANALYTICS_ADMIN_TOKEN=${ANALYTICS_ADMIN_TOKEN:?set in server environment}
      - ANALYTICS_IP_SALT=${ANALYTICS_IP_SALT:?set in server environment}
      - ANALYTICS_RETENTION_DAYS=90
      - ANALYTICS_DB_PATH=/app/data/analytics/analytics.db
      - CLOUDSEA_ENABLED=true
      - CLOUDSEA_ADMIN_TOKEN=${CLOUDSEA_ADMIN_TOKEN:?set in server environment}
      - CLOUDSEA_DB_PATH=/app/data/cloudsea/cloudsea.db
      - CLOUDSEA_ML_ENABLED=false
      - CLOUDSEA_CONTRIBUTE_ENABLED=true
      - CLOUDSEA_COMMUNITY_AUTO_APPROVE=false
      - CLOUDSEA_CURATE_MIN_LABELS=3
      - CONTRIBUTOR_SESSION_SECRET=${CONTRIBUTOR_SESSION_SECRET:?set in server environment}
      - CONTRIBUTOR_COOKIE_SECURE=true
      - UVICORN_WORKERS=2
      # AI 出行解读（OpenAI 兼容 API，如 DeepSeek）
      # - LLM_ADVISORY_ENABLED=true
      # - LLM_API_KEY=sk-...
      # - LLM_BASE_URL=https://api.deepseek.com
      # - LLM_MODEL=deepseek-chat
      - CLOUDSEA_DAILY_LABEL_CAP=30
      - CLOUDSEA_MAX_LOCATIONS_PER_CONTRIBUTOR=10
    volumes:
      - analytics_data:/app/data/analytics
      - cloudsea_data:/app/data/cloudsea
      - share_assets_data:/app/data/share-assets
      - share_cache_data:/app/data/share-cache
      # DEM 快照内嵌镜像 data/terrain，勿挂载空卷覆盖
      # 精选景区 JSON 使用镜像内嵌数据；勿挂载空目录，否则会覆盖导致 /api/spots/* 全部 404
      # 精选落库（curate）写入需配合部署脚本同步，见 scripts/sync-scenic-spots.sh
    depends_on:
      redis:
        condition: service_healthy
    dns:
      - 114.114.114.114
      - 8.8.8.8
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    mem_limit: 2g
    cpus: 2.0

volumes:
  redis_data:
  analytics_data:
  cloudsea_data:
  share_assets_data:
  share_cache_data:
